version: '3.8'

services:
  # 1. MySQL 8.0 Database Engine
  db:
    image: mysql:8.0
    container_name: tmath-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DB:-dmoj}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - data_mysql:/var/lib/mysql

  # 2. Redis Cache & Task Queue
  redis:
    image: redis:7-alpine
    container_name: tmath-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # 3. Ollama LLM Engine Container (Loads OLLAMA_CONTEXT_LENGTH dynamically from .env variable LLM_CONTEXT_WINDOW)
  ollama:
    image: ollama/ollama:latest
    container_name: tmath-ollama
    restart: always
    env_file:
      - .env
    environment:
      - OLLAMA_CONTEXT_LENGTH=${LLM_CONTEXT_WINDOW:-8192}
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # 4. Open WebUI (Reads OLLAMA_CONTEXT_LENGTH dynamically from .env variable LLM_CONTEXT_WINDOW)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: tmath-open-webui
    restart: always
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_CONTEXT_LENGTH=${LLM_CONTEXT_WINDOW:-8192}
    ports:
      - "3000:8080"
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - ollama

  # 5. FastAPI Backend AI Microservice (Reads LLM_CONTEXT_WINDOW dynamically from .env)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tmath-backend
    restart: always
    env_file:
      - .env
    environment:
      - LLM_BASE_URL=http://ollama:11434/v1
      - MYSQL_HOST=db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./scripts:/scripts
      - ./backup:/app/backup
      - ./backup:/backup
    depends_on:
      - db
      - redis
      - ollama

  # 6. React Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tmath-frontend
    restart: always
    environment:
      # Bắt buộc: trỏ proxy của Vite tới backend container (không phải localhost - là chính nó)
      - VITE_PROXY_TARGET=http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  data_mysql:
  ollama_data:
  open_webui_data:
